name: web-e2e

# Drives the built web UI in a real browser against the deploy stack. The
# vitest suite runs on MSW mocks, so it stays green when the real API drifts;
# this one does not.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTERO_URL: http://localhost:8080
      GOTERO_ADMIN_USER: admin
      GOTERO_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v5
      - name: write deploy/.env
        run: |
          {
            echo "GOTERO_SECRET=$(openssl rand -hex 32)"
            echo "GOTERO_ADMIN_USERNAME=${GOTERO_ADMIN_USER}"
            echo "GOTERO_ADMIN_PASSWORD=${GOTERO_ADMIN_PASSWORD}"
          } > deploy/.env
      # The image builds the UI from web/, so this is the bundle users get.
      - name: start gotero
        run: docker compose -f deploy/compose.yaml up -d --build
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: wait for /healthz
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "$GOTERO_URL/healthz" && exit 0
            sleep 2
          done
          echo "gotero did not become healthy" >&2
          exit 1
      - name: playwright
        working-directory: web
        run: pnpm test:e2e
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
      - name: gotero logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color gotero postgres
      - name: stop gotero
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
