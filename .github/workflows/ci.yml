name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", zotero, zoteroclient, storage, conformance]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: ${{ matrix.module }}
      # -coverpkg counts code exercised from other packages' tests too;
      # without it, code that is only driven from a neighbouring package (GC
      # through the jobs tests, say) reports as untested.
      - name: test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      # Floors sit a couple of points under the measured totals, so they
      # catch untested code piling up without failing on noise. conformance
      # has none: its suites run against a live server in conformance.yml.
      - name: coverage
        env:
          MODULE: ${{ matrix.module }}
          MIN_COVERAGE: ${{ fromJSON('{".":"75","zotero":"73","zoteroclient":"81","storage":"76","conformance":"0"}')[matrix.module] }}
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $NF); print $NF}')"
          echo "### Coverage for \`$MODULE\`: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t < m) }'; then
            echo "coverage ${total}% fell below the floor of ${MIN_COVERAGE}%" >&2
            exit 1
          fi
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: library builds without the workspace
        if: matrix.module != '.'
        env:
          GOWORK: "off"
        # Our own modules are pinned at v0.0.0 until we tag them, and that
        # only resolves through the replaces in go.work. Add them here
        # instead of committing replaces to go.mod.
        run: |
          for dep in $(go mod edit -json | jq -r '.Require[]?.Path | select(startswith("github.com/robertjndw/gotero/"))'); do
            go mod edit -replace="$dep=../${dep#github.com/robertjndw/gotero/}"
          done
          go build ./... && go vet ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: fuzz smoke (30s per target)
        run: ./scripts/fuzz.sh 30s

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # The pnpm version comes from packageManager, and package.json
          # lives in web/, not the repo root.
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      # Skip our own modules. They aren't dependencies, and the libraries
      # rely on the top-level LICENSE instead of carrying their own.
      - name: reject copyleft dependencies
        run: |
          go run github.com/google/go-licenses/v2@latest check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore github.com/robertjndw/gotero
      - name: no fetched Zotero sources committed
        run: |
          if git ls-files | grep -E '^e2e/(contract|desktop)/\.cache/'; then
            echo "AGPL Zotero sources must not be committed" >&2; exit 1
          fi
