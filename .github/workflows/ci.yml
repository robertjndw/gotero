name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", zotero, zoteroclient, storage, conformance]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: ${{ matrix.module }}
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: library builds without the workspace
        if: matrix.module != '.'
        env:
          GOWORK: "off"
        run: go build ./... && go vet ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: fuzz smoke (30s per target)
        run: ./scripts/fuzz.sh 30s

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # The pnpm version comes from packageManager, and package.json
          # lives in web/, not the repo root.
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      # Skip our own modules. They aren't dependencies, and the libraries
      # rely on the top-level LICENSE instead of carrying their own.
      - name: reject copyleft dependencies
        run: |
          go run github.com/google/go-licenses/v2@latest check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore github.com/robertjndw/gotero
      - name: no fetched Zotero sources committed
        run: |
          if git ls-files | grep -E '^e2e/(contract|desktop)/\.cache/'; then
            echo "AGPL Zotero sources must not be committed" >&2; exit 1
          fi
