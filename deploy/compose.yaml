# Quickstart: copy deploy/.env.example to deploy/.env, edit it, then
#   docker compose -f deploy/compose.yaml up -d
# Optional storage backends: add `--profile s3` or `--profile webdav`
# and set GOTERO_STORAGE_BACKEND accordingly.
name: gotero

services:
  gotero:
    image: ghcr.io/robertjndw/gotero:${GOTERO_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GOTERO_DATABASE_URL: postgres://gotero:${POSTGRES_PASSWORD:-gotero}@postgres:5432/gotero?sslmode=disable
      GOTERO_SECRET: ${GOTERO_SECRET:?set GOTERO_SECRET in deploy/.env (openssl rand -hex 32)}
      # Interpolated so a shell variable can override deploy/.env, e.g. in CI.
      GOTERO_PUBLIC_URL: ${GOTERO_PUBLIC_URL:-}
    ports:
      - "${GOTERO_PORT:-8080}:8080"
    volumes:
      - gotero-files:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/gotero", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gotero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gotero}
      POSTGRES_DB: gotero
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotero -d gotero"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A small S3 gateway for trying the s3 backend locally. In production point
  # GOTERO_STORAGE_S3_* at Garage, SeaweedFS, AWS, R2, Backblaze B2 etc.
  s3:
    profiles: [s3]
    image: versity/versitygw:v1.9.0
    command: ["--port", ":9000", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${GOTERO_STORAGE_S3_ACCESS_KEY:-gotero}
      ROOT_SECRET_KEY: ${GOTERO_STORAGE_S3_SECRET_KEY:-gotero-secret}
    volumes:
      - s3-data:/data

  webdav:
    profiles: [webdav]
    image: rclone/rclone:1.72
    command: serve webdav /data --addr :8080 --user ${GOTERO_STORAGE_WEBDAV_USERNAME:-gotero} --pass ${GOTERO_STORAGE_WEBDAV_PASSWORD:-gotero}
    volumes:
      - webdav-data:/data

volumes:
  gotero-files:
  postgres-data:
  s3-data:
  webdav-data:
