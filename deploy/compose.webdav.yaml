# Use the bundled WebDAV server for file storage:
#   docker compose -f deploy/compose.yaml -f deploy/compose.webdav.yaml --profile webdav up -d
# For your own WebDAV server (Nextcloud, ...), skip this file and set
# GOTERO_STORAGE_WEBDAV_* in .env.
services:
  gotero:
    environment:
      GOTERO_STORAGE_BACKEND: webdav
      GOTERO_STORAGE_WEBDAV_URL: http://webdav:8080/
      GOTERO_STORAGE_WEBDAV_USERNAME: ${GOTERO_STORAGE_WEBDAV_USERNAME:-gotero}
      GOTERO_STORAGE_WEBDAV_PASSWORD: ${GOTERO_STORAGE_WEBDAV_PASSWORD:-gotero}
    depends_on:
      webdav:
        condition: service_started
